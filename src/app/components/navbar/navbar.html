<nav class="navbar" aria-label="Navegación principal">
    <app-brand></app-brand>
    <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen"
        aria-controls="nav-actions"
        [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
        (click)="toggleMenu()"
    >
        <span class="menu-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </span>
    </button>
    <div id="nav-actions" class="nav-actions" [class.is-open]="menuOpen">
        @if (!userRole || userRole === 'guest'){
            <button class="btn-text">Registrarse</button>
            <button class="btn-primary">Iniciar sesión</button>
        }@else if (userRole === 'user' || userRole === 'moderator' || userRole === 'admin'){
            @if (userRole === 'user') {
                <button class="btn-text">Explorar</button>
                <button class="btn-text">Mensajes</button>
                <button class="btn-text">Perfil</button>
                <button class="btn-primary">+ Vender</button>
            }@else if (userRole === 'moderator') {
                <button class="btn-text">Explorar</button>
                <button class="btn-text">Moderación</button>
            }@else if (userRole === 'admin') {
                <button class="btn-text">Explorar</button>
                <button class="btn-text">Moderación</button>
                <button class="btn-text">Administración</button>
            }
            <button class="btn-text">Desconectarse</button>
        }
    </div>
</nav>
