<main class="home-hero">
  <section class="hero-copy" aria-labelledby="home-title">
    <p class="hero-eyebrow">Moda adulta · Compra y vende</p>
    <h1 id="home-title">
      <span>Lo bueno</span>
      <span>merece</span>
      <span class="hero-title-muted">otra vuelta.</span>
    </h1>
    <p class="hero-description">
      Un armario más consciente empieza por prendas que ya existen.
    </p>
    <a class="explore-button" routerLink="/articulos">
      <span>Explorar prendas</span>
      <span class="cta-arrow" aria-hidden="true"></span>

  <div class="hero-visual">

      class="hero-image-placeholder"
      role="img"
      aria-label="Imagen pendiente: blazer de segunda mano"
    ></div>
    <aside class="impact-card" aria-label="Impacto de la comunidad">
      <span>Esta comunidad ha dado</span>
      <strong>2.840</strong>
      <span>segundas vueltas</span>
    </aside>
  </div>
